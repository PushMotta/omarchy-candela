name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install jq, edid-decode, socat and qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq edid-decode socat qt6-declarative-dev-tools

      # Bash tests run the CLI inside a sandbox with a fake hyprctl and systemd;
      # node tests cover Model.js. No compositor is needed.
      - name: Backend and model tests
        run: ./test/all

      # The runner has qmllint but none of the QML modules the plugin imports —
      # not even QtQuick — so every type is "unresolved" and older qmllint
      # versions exit non-zero on those warnings alone. What this step exists
      # to catch is a file the QML parser cannot read, which qmllint reports as
      # a warning with id "syntax" (Qt ≥ 6.5) or a parse-error message. Fail
      # on those and nothing else.
      - name: QML lint
        run: |
          QMLLINT="$(command -v /usr/lib/qt6/bin/qmllint || command -v qmllint6 || command -v qmllint)"
          "$QMLLINT" --version
          status=0
          for f in *.qml components/*.qml; do
            bad="$("$QMLLINT" --json /dev/stdout "$f" 2>/dev/null \
              | jq -r '[.. | objects
                          | select(has("message"))
                          | select((.id? == "syntax") or (.message | test("expected token|unexpected token|syntax error|parse error"; "i")))
                          | "\(.line // "?"):\(.column // "?") \(.message)"] | .[]')"
            if [ -n "$bad" ]; then echo "== $f"; printf '%s\n' "$bad"; status=1; else echo "ok $f"; fi
          done
          exit $status
