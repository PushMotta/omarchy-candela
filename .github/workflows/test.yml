name: test

on:
  push:
    # next is where a release is prepared before it is merged to main.
    branches: [main, next]
  pull_request:

# This workflow only reads the repository and runs tests: it publishes
# nothing, comments nowhere and uploads no artifact. Declaring the floor here
# means every job inherits it, and a step that later needs more has to ask.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs rather than to the moving `v4`
      # tags. A tag can be repointed at any time by whoever owns it, and the
      # code behind it then runs here with this workflow's token; a SHA is the
      # exact reviewed tree. Update these deliberately, checking what changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install jq, edid-decode, socat and qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq edid-decode socat qt6-declarative-dev-tools

      # Bash tests run the CLI inside a sandbox with a fake hyprctl and systemd;
      # node tests cover Model.js. No compositor is needed.
      - name: Backend and model tests
        run: ./test/all

      # The runner has qmllint but none of the QML modules the plugin imports —
      # not even QtQuick — so every type is "unresolved" and older qmllint
      # versions exit non-zero on those warnings alone. What this step exists
      # to catch is a file the QML parser cannot read, which qmllint reports as
      # a warning with id "syntax" (Qt ≥ 6.5) or a parse-error message. Fail
      # on those and nothing else.
      - name: QML lint
        run: |
          QMLLINT="$(command -v /usr/lib/qt6/bin/qmllint || command -v qmllint6 || command -v qmllint)"
          if [ -z "$QMLLINT" ]; then echo "qmllint is required" >&2; exit 1; fi
          "$QMLLINT" --version
          status=0
          for f in *.qml components/*.qml; do
            result="$("$QMLLINT" --json /dev/stdout "$f" 2>/dev/null || true)"
            if [ -z "$result" ] || ! jq -s -e 'length > 0' >/dev/null 2>&1 <<<"$result"; then
              echo "== $f"; echo "qmllint returned no parseable JSON result" >&2; status=1; continue
            fi
            bad="$(jq -sr '[.. | objects
                          | select(has("message"))
                          | select((.id? == "syntax") or (.message | test("expected token|unexpected token|syntax error|parse error"; "i")))
                          | "\(.line // "?"):\(.column // "?") \(.message)"] | .[]' <<<"$result")"
            if [ -n "$bad" ]; then echo "== $f"; printf '%s\n' "$bad"; status=1; else echo "ok $f"; fi
          done
          exit $status
